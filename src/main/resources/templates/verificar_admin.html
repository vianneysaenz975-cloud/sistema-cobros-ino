<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Verificación Admin</title>

    <meta charset="UTF-8">

    <style>

        body{
            font-family:Segoe UI;
            background:#f4f7fc;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:white;
            padding:40px;
            border-radius:18px;
            box-shadow:0px 5px 15px rgba(0,0,0,0.1);
            width:400px;
        }

        h2{
            color:#FFD700;
            margin-bottom:20px;
            text-align:center;
        }

        input{
            width:100%;
            padding:13px;
            border-radius:10px;
            border:1px solid #ccc;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:13px;
            border:none;
            border-radius:10px;
            background:#1e3c72;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }

        .error{
            background:#f8d7da;
            color:#721c24;
            padding:10px;
            border-radius:10px;
            margin-bottom:15px;
        }

    </style>

</head>

<body>

<div class="card">

    <h2>🔐 Verificación Administrativa</h2>

    <div th:if="${error}" class="error">
        <span th:text="${error}"></span>
    </div>

    <form th:action="@{/usuarios/admin/verificar}"
          method="post">

        <input type="password"
               name="password"
               placeholder="Ingrese su contraseña"
               required>

        <button type="submit">
            Verificar acceso
        </button>

    </form>

</div>

</body>
</html>
