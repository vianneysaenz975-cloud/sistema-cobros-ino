<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estudiantes | Cobros INO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            padding: 25px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        .header {
            background: white;
            padding: 22px 35px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-left: 6px solid #87CEEB;
        }

        .header h1 {
            color: #1e3c72;
            font-size: 26px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #95a5a6, #7f8c8d);
            color: white;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(149, 165, 166, 0.3);
        }

        .btn-secondary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(149, 165, 166, 0.4);
        }

        .alert {
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            color: #155724;
            font-weight: 600;
            border-left: 5px solid #27ae60;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.2);
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            border-top: 5px solid #87CEEB;
        }

        .card h2 {
            color: #1e3c72;
            margin-bottom: 25px;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f2f5;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 15px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
            background: #f7f9fc;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2a5298;
            background: white;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.1);
        }

        .btn-primary {
            padding: 14px 35px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(30, 60, 114, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 60, 114, 0.4);
        }

        .table-container { overflow-x: auto; border-radius: 15px; }

        table { width: 100%; border-collapse: collapse; }

        table thead {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
        }

        table th {
            color: white;
            padding: 16px 15px;
            text-align: left;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        table td {
            padding: 15px;
            border-bottom: 1px solid #f0f2f5;
            font-size: 14px;
            color: #333;
        }

        table tbody tr { transition: all 0.2s; }

        table tbody tr:hover {
            background: #f7f9fc;
            transform: scale(1.01);
        }

        .badge {
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            color: #155724;
            display: inline-block;
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(231, 76, 60, 0.3);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .empty {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .empty-icon {
            font-size: 60px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .header { flex-direction: column; gap: 15px; text-align: center; }
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>👨‍🎓 Gestión de Estudiantes</h1>
        <a href="/usuarios/dashboard" class="btn-secondary">← Volver al Dashboard</a>
    </div>

    <div class="alert" th:if="${param.success}">
        ✅ Operación realizada correctamente
    </div>

    <!-- FORMULARIO -->
    <div class="card">
        <h2>➕ Nuevo Estudiante</h2>
        <form th:action="@{/estudiantes/crear}" method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>👤 Nombre completo</label>
                    <input type="text" name="nombre" required>
                </div>
                <div class="form-group">
                    <label>🆔 NIE</label>
                    <input type="text" name="nie" required>
                </div>
                <div class="form-group">
                    <label>📚 Grado</label>
                    <input type="text" name="grado" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>🔤 Sección</label>
                    <input type="text" name="seccion" required>
                </div>
                <div class="form-group">
                    <label>👨‍👩‍👧 Encargado</label>
                    <input type="text" name="encargado" required>
                </div>
                <div class="form-group">
                    <label>📞 Teléfono</label>
                    <input type="text" name="telefono" required>
                </div>
            </div>
            <button type="submit" class="btn-primary">💾 Guardar Estudiante</button>
        </form>
    </div>

    <!-- TABLA -->
    <div class="card">
        <h2>📋 Lista de Estudiantes</h2>
        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>NIE</th>
                    <th>Grado</th>
                    <th>Sección</th>
                    <th>Encargado</th>
                    <th>Teléfono</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${estudiantes}">
                    <td th:text="${e.id}"></td>
                    <td th:text="${e.nombre}"></td>
                    <td th:text="${e.nie}"></td>
                    <td th:text="${e.grado}"></td>
                    <td th:text="${e.seccion}"></td>
                    <td th:text="${e.encargado}"></td>
                    <td th:text="${e.telefono}"></td>
                    <td><span class="badge" th:text="${e.estado}"></span></td>
                    <td>
                        <a th:href="@{/estudiantes/eliminar/{id}(id=${e.id})}"
                           class="btn-danger"
                           onclick="return confirm('¿Eliminar este estudiante?')">🗑️</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(estudiantes)}">
                    <td colspan="9" class="empty">
                        <div class="empty-icon">📭</div>
                        No hay estudiantes registrados
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
