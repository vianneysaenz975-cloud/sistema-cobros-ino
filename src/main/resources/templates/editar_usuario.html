<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Editar Usuario</title>

    <meta charset="UTF-8">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI',sans-serif;
            background:#f4f7fc;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .card{
            width:100%;
            max-width:500px;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0px 10px 25px rgba(0,0,0,0.1);
        }

        h1{
            color:#1e3c72;
            margin-bottom:25px;
            text-align:center;
        }

        input,
        select{
            width:100%;
            padding:14px;
            margin-bottom:15px;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:15px;
            transition:0.3s;
        }

        input:focus,
        select:focus{
            outline:none;
            border-color:#2a5298;
            box-shadow:0px 0px 10px rgba(42,82,152,0.3);
        }

        .btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:12px;
            background:#2a5298;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
            font-weight:bold;
        }

        .btn:hover{
            background:#1e3c72;
            transform:translateY(-2px);
        }

        .error{
            background:#f8d7da;
            color:#721c24;
            padding:12px;
            border-radius:10px;
            margin-bottom:15px;
        }

        /* ====================================== */
        /* MODAL */
        /* ====================================== */

        .modal{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.55);
            z-index:99999;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .modal-content{
            background:white;
            padding:30px;
            border-radius:20px;
            width:100%;
            max-width:420px;
            text-align:center;
            box-shadow:0px 10px 30px rgba(0,0,0,0.3);
            animation:aparecer 0.25s ease;
        }

        .modal-content h2{
            color:#1e3c72;
            margin-bottom:15px;
        }

        .modal-content p{
            color:#555;
            margin-bottom:25px;
            font-size:16px;
            line-height:1.5;
        }

        .modal-buttons{
            display:flex;
            justify-content:center;
            gap:15px;
        }

        .btn-cancel{
            padding:12px 22px;
            border:none;
            border-radius:10px;
            background:#e74c3c;
            color:white;
            cursor:pointer;
            font-weight:bold;
            transition:0.3s;
        }

        .btn-cancel:hover{
            background:#c0392b;
        }

        .btn-confirm{
            padding:12px 22px;
            border:none;
            border-radius:10px;
            background:#27ae60;
            color:white;
            cursor:pointer;
            font-weight:bold;
            transition:0.3s;
        }

        .btn-confirm:hover{
            background:#1f8b4d;
        }

        @keyframes aparecer{

            from{
                transform:scale(0.8);
                opacity:0;
            }

            to{
                transform:scale(1);
                opacity:1;
            }
        }

    </style>

</head>

<body>

<div class="card">

    <h1>✏️ Editar Usuario</h1>

    <div th:if="${error}" class="error">
        <span th:text="${error}"></span>
    </div>

    <form id="formEditar"
          th:action="@{/usuarios/admin/actualizar}"
          method="post">

        <input type="hidden"
               name="id"
               th:value="${usuarioEditar.id}">

        <input type="text"
               id="username"
               name="username"
               th:value="${usuarioEditar.username}"
               placeholder="Usuario"
               required>

        <input type="password"
               id="password"
               name="password"
               placeholder="Nueva contraseña">

        <input type="password"
               id="confirmar"
               name="confirmarPassword"
               placeholder="Confirmar contraseña">

        <select name="rol">

            <option value="admin"
                    th:selected="${usuarioEditar.rol == 'admin'}">
                admin
            </option>

            <option value="cajero"
                    th:selected="${usuarioEditar.rol == 'cajero'}">
                cajero
            </option>

            <option value="director"
                    th:selected="${usuarioEditar.rol == 'director'}">
                director
            </option>

            <option value="docente"
                    th:selected="${usuarioEditar.rol == 'docente'}">
                docente
            </option>

            <option value="CDE"
                    th:selected="${usuarioEditar.rol == 'CDE'}">
                CDE
            </option>

        </select>

        <button type="button"
                class="btn"
                onclick="confirmarEdicion()">

            💾 Guardar Cambios

        </button>

    </form>

</div>

<!-- ====================================== -->
<!-- MODAL -->
<!-- ====================================== -->

<div id="modalConfirmacion"
     class="modal">

    <div class="modal-content">

        <h2 id="tituloModal">
            Confirmación
        </h2>

        <p id="mensajeModal"></p>

        <div class="modal-buttons">

            <button type="button"
                    class="btn-cancel"
                    onclick="cerrarModal()">

                Cancelar

            </button>

            <button type="button"
                    class="btn-confirm"
                    id="btnConfirmar">

                Confirmar

            </button>

        </div>

    </div>

</div>

<script>

    let accionPendiente = null;

    // ======================================
    // ABRIR MODAL
    // ======================================

    function abrirModal(mensaje, callback){

        document.getElementById("mensajeModal")
            .innerText = mensaje;

        document.getElementById("modalConfirmacion")
            .style.display = "flex";

        accionPendiente = callback;
    }

    // ======================================
    // CERRAR MODAL
    // ======================================

    function cerrarModal(){

        document.getElementById("modalConfirmacion")
            .style.display = "none";

        accionPendiente = null;
    }

    // ======================================
    // BOTON CONFIRMAR
    // ======================================

    document.getElementById("btnConfirmar")
        .addEventListener("click", function(){

            if(accionPendiente){
                accionPendiente();
            }

            cerrarModal();
        });

    // ======================================
    // VALIDAR FORMULARIO
    // ======================================

    function validarFormulario(){

        let username =
            document.getElementById("username").value.trim();

        let password =
            document.getElementById("password").value.trim();

        let confirmar =
            document.getElementById("confirmar").value.trim();

        if(username === ""){

            abrirModal(
                "El usuario no puede estar vacío",
                function(){}
            );

            return false;
        }

        if(password !== ""){

            if(password !== confirmar){

                abrirModal(
                    "Las contraseñas no coinciden",
                    function(){}
                );

                return false;
            }

            if(password.length < 4){

                abrirModal(
                    "La contraseña debe tener mínimo 4 caracteres",
                    function(){}
                );

                return false;
            }
        }

        return true;
    }

    // ======================================
    // CONFIRMAR EDICION
    // ======================================

    function confirmarEdicion(){

        if(!validarFormulario()){
            return;
        }

        abrirModal(
            "¿Deseas guardar los cambios del usuario?",
            function(){

                document.getElementById("formEditar")
                    .submit();

            }
        );
    }

</script>

</body>
</html>
