<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Cobros INO</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #1e3c72, #0f2555);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            padding: 20px;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Partículas flotantes */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            padding: 50px 40px;
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.8s ease;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-circle {
            width: 90px;
            height: 90px;
            margin: 0 auto;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            box-shadow: 0 10px 25px rgba(30, 60, 114, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 8px;
            color: #1e3c72;
            font-size: 32px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 35px;
            font-size: 15px;
        }

        .input-group {
            margin-bottom: 25px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 18px;
            border-radius: 12px;
            border: 2px solid #e1e8ed;
            font-size: 15px;
            transition: all 0.3s;
            background: #f7f9fc;
        }

        .input-group input:focus {
            outline: none;
            border-color: #2a5298;
            background: white;
            box-shadow: 0 0 0 4px rgba(42, 82, 152, 0.1);
            transform: translateY(-2px);
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(30, 60, 114, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(30, 60, 114, 0.4);
            background: linear-gradient(135deg, #2a5298, #1e3c72);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .error {
            margin-bottom: 20px;
            background: #ffe5e5;
            color: #c0392b;
            padding: 14px 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            border-left: 4px solid #c0392b;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .success {
            margin-bottom: 20px;
            background: #e8fff1;
            color: #27ae60;
            padding: 14px 18px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            border-left: 4px solid #27ae60;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #999;
            font-size: 13px;
        }

        .footer span {
            color: #2a5298;
            font-weight: bold;
        }

        /* ========================================= */
        /* RESPONSIVE - TABLET (768px)               */
        /* ========================================= */
        @media (max-width: 768px) {
            body { padding: 15px; }
            .login-container { max-width: 100%; }
            .login-box {
                padding: 40px 30px;
                border-radius: 22px;
            }
            .login-box h2 { font-size: 28px; }
            .logo-circle {
                width: 80px;
                height: 80px;
                font-size: 40px;
            }
            .subtitle { font-size: 14px; margin-bottom: 30px; }
            .input-group input { padding: 14px 16px; }
            .login-btn { padding: 15px; font-size: 15px; }
        }

        /* ========================================= */
        /* RESPONSIVE - MÓVIL (480px)                */
        /* ========================================= */
        @media (max-width: 480px) {
            body { padding: 10px; }
            .login-box {
                padding: 30px 20px;
                border-radius: 18px;
            }
            .login-box h2 { font-size: 24px; }
            .logo-circle {
                width: 70px;
                height: 70px;
                font-size: 34px;
            }
            .subtitle { font-size: 13px; margin-bottom: 25px; }
            .input-group { margin-bottom: 18px; }
            .input-group label { font-size: 13px; }
            .input-group input {
                padding: 12px 14px;
                font-size: 14px;
            }
            .login-btn {
                padding: 14px;
                font-size: 15px;
            }
            .footer { font-size: 12px; margin-top: 20px; }
            .particles { display: none; }
        }

        /* ========================================= */
        /* RESPONSIVE - MÓVIL PEQUEÑO (360px)        */
        /* ========================================= */
        @media (max-width: 360px) {
            .login-box { padding: 25px 15px; }
            .login-box h2 { font-size: 22px; }
            .logo-circle {
                width: 60px;
                height: 60px;
                font-size: 28px;
            }
            .input-group input { padding: 11px 12px; font-size: 13px; }
            .login-btn { padding: 12px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- Partículas flotantes -->
    <div class="particles">
        <div class="particle" style="left: 10%; width: 10px; height: 10px; animation-delay: 0s;"></div>
        <div class="particle" style="left: 20%; width: 15px; height: 15px; animation-delay: 2s;"></div>
        <div class="particle" style="left: 40%; width: 8px; height: 8px; animation-delay: 4s;"></div>
        <div class="particle" style="left: 60%; width: 12px; height: 12px; animation-delay: 1s;"></div>
        <div class="particle" style="left: 80%; width: 10px; height: 10px; animation-delay: 3s;"></div>
        <div class="particle" style="left: 90%; width: 14px; height: 14px; animation-delay: 5s;"></div>
    </div>

    <div class="login-container">
        <div class="login-box">

            <div class="logo-container">
                <div class="logo-circle">
                    🏢
                </div>
            </div>

            <h2>Bienvenido</h2>
            <p class="subtitle">Sistema de Cobros INO</p>

            <div class="error" th:if="${error}" th:text="${error}"></div>
            <div class="success" th:if="${mensaje}" th:text="${mensaje}"></div>

            <form th:action="@{/usuarios/login}" method="post" autocomplete="off">

                <div class="input-group">
                    <label>👤 Usuario</label>
                    <input type="text"
                           name="username"
                           autocomplete="off"
                           required>
                </div>

                <div class="input-group">
                    <label>🔒 Contraseña</label>
                    <input type="password"
                           name="password"
                           autocomplete="new-password"
                           required>
                </div>

                <button type="submit" class="login-btn">
                    🚀 Iniciar Sesión
                </button>

            </form>

            <div class="footer">
                © 2026 <span>Cobros INO</span>
            </div>

        </div>
    </div>

</body>
</html>
