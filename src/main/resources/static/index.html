<!DOCTYPE html>
<html>
<head>
    <title>Sistema de Cobros</title>
    <style>
        /* Estilos para hacer la página bonita */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        
        .status {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 30px;
            font-weight: bold;
        }
        
        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .btn-primary {
            background: #667eea;
        }
        
        .btn-success {
            background: #4CAF50;
        }
        
        .btn-info {
            background: #2196F3;
        }
        
        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 14px;
        }
        
        .footer span {
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🏢</div>
        <h1>Cobros Inox</h1>
        <p class="subtitle">Sistema de Gestión de Cobros</p>
        
        <div class="status">✅ Sistema Activo</div>
        
        <div class="menu">
            <a href="/login" class="btn btn-primary">🔐 Iniciar Sesión</a>
            <a href="/api/usuarios" class="btn btn-success">👥 Ver Usuarios</a>
            <a href="/api/cobros" class="btn btn-info">💰 Ver Cobros</a>
        </div>
        
        <div class="footer">
            Desarrollado con <span>❤️</span> para Cobros Inox
        </div>
    </div>
</body>
</html>
